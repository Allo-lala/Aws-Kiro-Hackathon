apiVersion: apps/v1
kind: Deployment
metadata:
  name: eco-route-backend
  namespace: eco-route-planner
  labels:
    app: eco-route-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: eco-route-backend
  template:
    metadata:
      labels:
        app: eco-route-backend
    spec:
      containers:
      - name: backend
        image: your-registry.com/eco-route-backend:latest
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        - name: DB_HOST
          value: "postgres-service"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: eco-route-config
              key: db-name
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: eco-route-config
              key: db-user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: eco-route-secrets
              key: db-password
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: eco-route-secrets
              key: jwt-secret
        - name: GOOGLE_MAPS_API_KEY
          valueFrom:
            secretKeyRef:
              name: eco-route-secrets
              key: google-maps-api-key
        - name: SENDGRID_API_KEY
          valueFrom:
            secretKeyRef:
              name: eco-route-secrets
              key: sendgrid-api-key
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: eco-route-backend
  namespace: eco-route-planner
spec:
  selector:
    app: eco-route-backend
  ports:
  - protocol: TCP
    port: 3000
    targetPort: 3000
  type: ClusterIP
