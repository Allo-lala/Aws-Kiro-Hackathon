AWSTemplateFormatVersion: '2010-09-09'
Description: 'Master Infrastructure Template for Eco-Friendly Route Planner - Orchestrates VPC, Security Groups, and IAM deployment'

Parameters:
  ProjectName:
    Type: String
    Default: 'eco-route-planner'
    Description: 'Name of the project for resource naming'
  
  Environment:
    Type: String
    Default: 'production'
    AllowedValues: ['development', 'staging', 'production']
    Description: 'Environment name'

  VpcCidr:
    Type: String
    Default: '10.0.0.0/16'
    Description: 'CIDR block for VPC'

  TemplatesBucketName:
    Type: String
    Description: 'S3 bucket containing CloudFormation templates'

Resources:
  # VPC Infrastructure Stack
  VPCStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://${TemplatesBucketName}.s3.amazonaws.com/vpc-infrastructure.yaml'
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        VpcCidr: !Ref VpcCidr
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-vpc-stack'
        - Key: Environment
          Value: !Ref Environment
        - Key: Component
          Value: 'VPC'

  # IAM Roles Stack
  IAMStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://${TemplatesBucketName}.s3.amazonaws.com/iam-roles.yaml'
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
      Capabilities:
        - CAPABILITY_NAMED_IAM
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-iam-stack'
        - Key: Environment
          Value: !Ref Environment
        - Key: Component
          Value: 'IAM'

  # Security Groups Stack
  SecurityGroupsStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: VPCStack
    Properties:
      TemplateURL: !Sub 'https://${TemplatesBucketName}.s3.amazonaws.com/security-groups.yaml'
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        VpcId: !GetAtt VPCStack.Outputs.VPC
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-security-groups-stack'
        - Key: Environment
          Value: !Ref Environment
        - Key: Component
          Value: 'SecurityGroups'

Outputs:
  # VPC Outputs
  VPC:
    Description: 'VPC ID'
    Value: !GetAtt VPCStack.Outputs.VPC
    Export:
      Name: !Sub '${ProjectName}-${Environment}-VPC'

  PublicSubnets:
    Description: 'Public subnet IDs'
    Value: !GetAtt VPCStack.Outputs.PublicSubnets
    Export:
      Name: !Sub '${ProjectName}-${Environment}-PublicSubnets'

  PrivateSubnets:
    Description: 'Private subnet IDs'
    Value: !GetAtt VPCStack.Outputs.PrivateSubnets
    Export:
      Name: !Sub '${ProjectName}-${Environment}-PrivateSubnets'

  DatabaseSubnets:
    Description: 'Database subnet IDs'
    Value: !GetAtt VPCStack.Outputs.DatabaseSubnets
    Export:
      Name: !Sub '${ProjectName}-${Environment}-DatabaseSubnets'

  # Security Group Outputs
  ALBSecurityGroup:
    Description: 'Application Load Balancer Security Group ID'
    Value: !GetAtt SecurityGroupsStack.Outputs.ALBSecurityGroup
    Export:
      Name: !Sub '${ProjectName}-${Environment}-ALBSecurityGroup'

  ECSSecurityGroup:
    Description: 'ECS Security Group ID'
    Value: !GetAtt SecurityGroupsStack.Outputs.ECSSecurityGroup
    Export:
      Name: !Sub '${ProjectName}-${Environment}-ECSSecurityGroup'

  RDSSecurityGroup:
    Description: 'RDS Security Group ID'
    Value: !GetAtt SecurityGroupsStack.Outputs.RDSSecurityGroup
    Export:
      Name: !Sub '${ProjectName}-${Environment}-RDSSecurityGroup'

  # IAM Role Outputs
  ECSTaskExecutionRoleArn:
    Description: 'ECS Task Execution Role ARN'
    Value: !GetAtt IAMStack.Outputs.ECSTaskExecutionRoleArn
    Export:
      Name: !Sub '${ProjectName}-${Environment}-ECSTaskExecutionRoleArn'

  ECSFrontendTaskRoleArn:
    Description: 'ECS Frontend Task Role ARN'
    Value: !GetAtt IAMStack.Outputs.ECSFrontendTaskRoleArn
    Export:
      Name: !Sub '${ProjectName}-${Environment}-ECSFrontendTaskRoleArn'

  ECSBackendTaskRoleArn:
    Description: 'ECS Backend Task Role ARN'
    Value: !GetAtt IAMStack.Outputs.ECSBackendTaskRoleArn
    Export:
      Name: !Sub '${ProjectName}-${Environment}-ECSBackendTaskRoleArn'

  RDSEnhancedMonitoringRoleArn:
    Description: 'RDS Enhanced Monitoring Role ARN'
    Value: !GetAtt IAMStack.Outputs.RDSEnhancedMonitoringRoleArn
    Export:
      Name: !Sub '${ProjectName}-${Environment}-RDSEnhancedMonitoringRoleArn'